name: Bug report
description: Report a reproducible problem in the platform.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Open ...\n2. Select ...\n3. Observe ..."
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Page or API route
      placeholder: /courses or /api/v1/courses
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Frontend, Laravel API, Content or broken link, Deployment]
    validations:
      required: true
