<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Dev Nexus Academy</title>
  <desc id="description">Official social card for the bilingual technology learning platform.</desc>
  <defs>
    <linearGradient id="background" x1="70" y1="40" x2="1120" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1730"/>
      <stop offset="1" stop-color="#07101F"/>
    </linearGradient>
    <linearGradient id="accent" x1="750" y1="150" x2="1060" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58E6C2"/>
      <stop offset="1" stop-color="#6B8CFF"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0v42" fill="none" stroke="#87A4D0" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="30" fill="url(#background)"/>
  <rect width="1200" height="630" rx="30" fill="url(#grid)"/>
  <circle cx="990" cy="124" r="170" fill="#3158B4" opacity=".12" filter="url(#glow)"/>
  <circle cx="826" cy="530" r="150" fill="#32BCA0" opacity=".1" filter="url(#glow)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="72" y="68" width="230" height="42" rx="21" fill="#142846" stroke="#294A72"/>
    <circle cx="96" cy="89" r="6" fill="#58E6C2"/>
    <text x="114" y="96" fill="#BFD0E8" font-size="18" font-weight="600" letter-spacing="1.8">LEARNING PLATFORM</text>

    <text x="70" y="230" fill="#F4F7FB" font-size="74" font-weight="740" letter-spacing="-2">Dev Nexus</text>
    <text x="74" y="300" fill="#8EACD4" font-size="34" font-weight="650" letter-spacing="12">ACADEMY</text>
    <text x="72" y="372" fill="#C8D5E8" font-size="25">Code. Learn. Build. Evolve.</text>
    <text x="72" y="414" fill="#8298B8" font-size="19">Courses, books, articles, and practical roadmaps.</text>

    <g font-size="17" font-weight="600">
      <rect x="72" y="474" width="170" height="46" rx="14" fill="#102541" stroke="#294A72"/>
      <text x="96" y="504" fill="#7CEBD0">20 disciplines</text>
      <rect x="255" y="474" width="170" height="46" rx="14" fill="#102541" stroke="#294A72"/>
      <text x="279" y="504" fill="#9CB8FF">16 roadmaps</text>
      <rect x="438" y="474" width="145" height="46" rx="14" fill="#102541" stroke="#294A72"/>
      <text x="467" y="504" fill="#F2C94C">AR + EN</text>
    </g>
  </g>

  <g transform="translate(755 92) scale(5.25)">
    <path d="M32 3 57 17.5v29L32 61 7 46.5v-29L32 3Z" fill="#09152A"/>
    <path d="M32 5.5 54.8 18.7v26.6L32 58.5 9.2 45.3V18.7L32 5.5Z" fill="none" stroke="#2B4368" stroke-width="2"/>
    <path d="m25.5 20-11 12 11 12M38.5 20l11 12-11 12M27 32h10" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="32" r="4" fill="#F2C94C"/>
    <circle cx="49" cy="19" r="2.5" fill="#58E6C2"/>
  </g>

  <path d="M72 565h1056" stroke="#29405F"/>
  <text x="72" y="594" fill="#637B9D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" letter-spacing="1.5">DEV-NEXUS-ACADEMY</text>
</svg>
